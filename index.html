<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Subheading -->
    <h2>About This Page</h2>

    <!-- Text Paragraph -->
    <p>This is a standard paragraph of text. HTML uses tags to structure content for the web browser.</p>
    
    <p>You can make text <strong>bold</strong> or <em>italicized</em> easily.</p>

    <!-- Hyperlink -->
    <p>Visit the official <a href="https://www.w3schools.com" target="_blank">W3Schools website</a> for more tutorials.</p>

    <!-- Image Element -->
    <img src="https://placeholder.com" alt="Sample Placeholder Image" width="150" height="150">

    <!-- Unordered List -->
    <h3>My Favorite Fruits</h3>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
